server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /srv/uwc-hpc-skills/current;
    index index.html;

    location = /healthz {
        access_log off;
        return 204;
    }

    location /admin-static/ {
        alias /srv/uwc-hpc-content/admin-static/;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /content/current.json {
        alias /srv/uwc-hpc-content/content/current.json;
        add_header Cache-Control "no-store";
    }

    location /content/releases/ {
        alias /srv/uwc-hpc-content/content/releases/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
